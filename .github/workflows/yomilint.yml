name: yomilint

# The annotation font checker in tools/yomilint has its own tests and does
# not import src, so it runs apart from the font pipeline's workflows.
on:
  push:
    branches: [ master ]
    paths:
      - 'tools/yomilint/**'
      - '.github/workflows/yomilint.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/yomilint/**'
      - '.github/workflows/yomilint.yml'

jobs:
  test:
    name: yomilint tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools uharfbuzz opentype-sanitizer pytest black isort flake8 mypy

      - name: Check formatting and lint
        working-directory: tools/yomilint
        run: |
          python -m black --check --diff .
          python -m isort --profile black --check-only --diff .
          python -m flake8 --max-line-length 88 --extend-ignore E203,E501,W503,E402 --max-complexity 12 .
          python -m mypy --ignore-missing-imports yomilint

      - name: Run tests
        working-directory: tools/yomilint
        run: python -m pytest
